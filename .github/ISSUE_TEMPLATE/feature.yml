name: Feature Request
description: Template for requsting a feature
title: '[Feature Request]: '
labels:
  - enhancement
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the problem or missing capability
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: What project is this bug related to?
      options:
        - label: Minecraft Server
          value: project/minecraft-server
        - label: Website
          value: project/website
        - label: History Survival
          value: project/history-survival
        - label: GT MOS
          value: project/gt-mos
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: If you have a solution in mind, please describe it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: Have you considered any alternative solutions or workarounds?
