name: Bug report
description: Template for bug reports
title: '[Bug]: '
labels:
  - bug
  - triage
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the problem
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: What project is this bug related to?
      options:
        - Minecraft Server
        - Website
        - History Survival
        - GT MOS
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal Reproduction
      description: provide steps to reproduce the problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: Exception. Error. or logs
      description: provide error logs
    validations:
      required: true
