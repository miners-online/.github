name: Bug report (History Survival)
description: Template for History Survival bug reports
title: '[Bug (History Survival)]: '
type: Bug
labels:
  - project/history-survival
  - triage
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal Reproduction
      description: provide steps to reproduce the problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: Exception. Error. or logs
      description: provide error logs
    validations:
      required: true
